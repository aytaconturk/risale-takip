# main'e her push'ta web sürümünü derleyip aytaconturk.github.io/risale-takip adresinde yayınlar.
# Supabase adresi ve anon anahtarı app/.env.production'dan gelir (herkese açık değerler; veriyi RLS korur).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    env:
      EXPO_BASE_URL: /risale-takip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx expo export -p web && node scripts/web-hazirla.mjs dist
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: dagit
        uses: actions/deploy-pages@v4
